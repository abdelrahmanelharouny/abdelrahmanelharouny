<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">AEL — Connected Project Playground</title>
<desc id="desc">A playful colorful map of 14 showcased repositories grouped into six connected engineering domains.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101327"/><stop offset="1" stop-color="#102630"/></linearGradient>
  <linearGradient id="core" x2="1"><stop stop-color="#ffd166"/><stop offset="1" stop-color="#ff8b9b"/></linearGradient>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c7d4ff" opacity=".15"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1440" height="850" rx="26" fill="url(#bg)"/><rect width="1440" height="850" rx="26" fill="url(#dots)"/>
<text x="58" y="58" font-family="Arial,Helvetica,sans-serif" fill="#63e6d2" font-size="14" font-weight="700" letter-spacing="4">AEL / CONNECTED PROJECT PLAYGROUND</text>
<text x="58" y="101" font-family="Arial,Helvetica,sans-serif" fill="#f8f7ff" font-size="32" font-weight="800">Different problems. One curious engineering mindset.</text>
<text x="1380" y="58" text-anchor="end" font-family="monospace" fill="#ffd166" font-size="12">14 PROJECTS  /  6 DOMAINS</text>
