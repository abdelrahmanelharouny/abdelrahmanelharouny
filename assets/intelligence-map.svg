<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">AEL Intelligence Map</title>
<desc id="desc">A portfolio map linking Abdelrahman's 14 showcased repositories across AI platforms, geospatial intelligence, algorithms, applied machine learning, computer vision, cybersecurity, and visual computing.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080f14"/><stop offset="1" stop-color="#14262d"/></linearGradient>
