<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="230" viewBox="0 0 1440 230" role="img" aria-labelledby="t d">
<title id="t">Engineering Loop</title><desc id="d">A six-step process from problem understanding to shipping and learning.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09141a"/><stop offset="1" stop-color="#14252b"/></linearGradient><linearGradient id="a" x2="1"><stop stop-color="#b9f36b"/><stop offset="1" stop-color="#56d9cf"/></linearGradient></defs>
<rect width="1440" height="230" rx="18" fill="url(#bg)"/><path d="M118 103 H1320" stroke="url(#a)" stroke-width="2" stroke-opacity=".65"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<g><circle cx="120" cy="103" r="28" fill="#13272b" stroke="#b9f36b" stroke-width="2"/><text x="120" y="109" fill="#b9f36b" font-size="16" font-weight="700">01</text><text x="120" y="159" fill="#eff5f2" font-size="15" font-weight="700">UNDERSTAND</text><text x="120" y="181" fill="#91aaa6" font-size="11">Define the problem</text></g>
<g><circle cx="360" cy="103" r="28" fill="#13272b" stroke="#a4e77c" stroke-width="2"/><text x="360" y="109" fill="#b9f36b" font-size="16" font-weight="700">02</text><text x="360" y="159" fill="#eff5f2" font-size="15" font-weight="700">RESEARCH</text><text x="360" y="181" fill="#91aaa6" font-size="11">Gather evidence</text></g>
<g><circle cx="600" cy="103" r="28" fill="#13272b" stroke="#83e39a" stroke-width="2"/><text x="600" y="109" fill="#79e0b0" font-size="16" font-weight="700">03</text><text x="600" y="159" fill="#eff5f2" font-size="15" font-weight="700">ARCHITECT</text><text x="600" y="181" fill="#91aaa6" font-size="11">Make decisions</text></g>
<g><circle cx="840" cy="103" r="28" fill="#13272b" stroke="#70dec0" stroke-width="2"/><text x="840" y="109" fill="#63ddc9" font-size="16" font-weight="700">04</text><text x="840" y="159" fill="#eff5f2" font-size="15" font-weight="700">BUILD</text><text x="840" y="181" fill="#91aaa6" font-size="11">Implement the system</text></g>
<g><circle cx="1080" cy="103" r="28" fill="#13272b" stroke="#5bd9cf" stroke-width="2"/><text x="1080" y="109" fill="#56d9cf" font-size="16" font-weight="700">05</text><text x="1080" y="159" fill="#eff5f2" font-size="15" font-weight="700">EVALUATE</text><text x="1080" y="181" fill="#91aaa6" font-size="11">Measure &amp; improve</text></g>
<g><circle cx="1320" cy="103" r="28" fill="#13272b" stroke="#56d9cf" stroke-width="2"/><text x="1320" y="109" fill="#56d9cf" font-size="16" font-weight="700">06</text><text x="1320" y="159" fill="#eff5f2" font-size="15" font-weight="700">SHIP</text><text x="1320" y="181" fill="#91aaa6" font-size="11">Deliver &amp; learn</text></g>
</g></svg>