<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="250" viewBox="0 0 1440 250" role="img" aria-labelledby="title desc">
<title id="title">Engineering process</title>
<desc id="desc">A six-stage engineering process: understand, investigate, architect, build, evaluate, and deliver.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A0F12"/><stop offset="1" stop-color="#111B1F"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D7F36A"/><stop offset="1" stop-color="#9BD7B2"/></linearGradient>
</defs>
<rect width="1440" height="250" rx="18" fill="url(#bg)"/>
<text x="56" y="44" fill="#D7F36A" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2.2">THE ENGINEERING LOOP</text>
<text x="1384" y="44" fill="#71827E" text-anchor="end" font-family="monospace" font-size="10" letter-spacing="1.3">FROM QUESTION TO DEPLOYABLE SYSTEM</text>
<path d="M120 112H1320" stroke="#34454A" stroke-width="2"/>
<path d="M120 112H1320" stroke="url(#line)" stroke-width="2" stroke-opacity=".65"/>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
  <g>
    <circle cx="120" cy="112" r="24" fill="#111B1F" stroke="#D7F36A" stroke-width="2"/>
    <text x="120" y="117" fill="#D7F36A" font-family="monospace" font-size="13" font-weight="700">01</text>
    <text x="120" y="166" fill="#EFF3EC" font-size="15" font-weight="700" letter-spacing=".7">UNDERSTAND</text>
    <text x="120" y="190" fill="#879994" font-size="11">Define the problem</text>
  </g>
  <g>
    <circle cx="360" cy="112" r="24" fill="#111B1F" stroke="#CBEA7B" stroke-width="2"/>
    <text x="360" y="117" fill="#CBEA7B" font-family="monospace" font-size="13" font-weight="700">02</text>
    <text x="360" y="166" fill="#EFF3EC" font-size="15" font-weight="700" letter-spacing=".7">INVESTIGATE</text>
    <text x="360" y="190" fill="#879994" font-size="11">Gather evidence</text>
  </g>
  <g>
    <circle cx="600" cy="112" r="24" fill="#111B1F" stroke="#B9E59A" stroke-width="2"/>
    <text x="600" y="117" fill="#B9E59A" font-family="monospace" font-size="13" font-weight="700">03</text>
    <text x="600" y="166" fill="#EFF3EC" font-size="15" font-weight="700" letter-spacing=".7">ARCHITECT</text>
    <text x="600" y="190" fill="#879994" font-size="11">Choose the system</text>
  </g>
  <g>
    <circle cx="840" cy="112" r="24" fill="#111B1F" stroke="#A8DCA6" stroke-width="2"/>
    <text x="840" y="117" fill="#A8DCA6" font-family="monospace" font-size="13" font-weight="700">04</text>
    <text x="840" y="166" fill="#EFF3EC" font-size="15" font-weight="700" letter-spacing=".7">BUILD</text>
    <text x="840" y="190" fill="#879994" font-size="11">Implement end to end</text>
  </g>
  <g>
    <circle cx="1080" cy="112" r="24" fill="#111B1F" stroke="#9BD7B2" stroke-width="2"/>
    <text x="1080" y="117" fill="#9BD7B2" font-family="monospace" font-size="13" font-weight="700">05</text>
    <text x="1080" y="166" fill="#EFF3EC" font-size="15" font-weight="700" letter-spacing=".7">EVALUATE</text>
    <text x="1080" y="190" fill="#879994" font-size="11">Measure and improve</text>
  </g>
  <g>
    <circle cx="1320" cy="112" r="24" fill="#111B1F" stroke="#9BD7B2" stroke-width="2"/>
    <text x="1320" y="117" fill="#9BD7B2" font-family="monospace" font-size="13" font-weight="700">06</text>
    <text x="1320" y="166" fill="#EFF3EC" font-size="15" font-weight="700" letter-spacing=".7">DELIVER</text>
    <text x="1320" y="190" fill="#879994" font-size="11">Ship and learn</text>
  </g>
</g>
<text x="56" y="226" fill="#657773" font-family="monospace" font-size="9" letter-spacing="1.2">REPEATABLE BY DESIGN · ACCOUNTABLE BY DEFAULT</text>
</svg>