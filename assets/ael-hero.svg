<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="470" viewBox="0 0 1440 470" role="img" aria-labelledby="title desc">
<title id="title">AEL — Curiosity starts the idea. Engineering makes it real.</title>
<desc id="desc">A colorful, playful engineering identity with connected AI, machine-learning, data, and product nodes orbiting a central idea-to-system spark.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101327"/><stop offset=".52" stop-color="#171832"/><stop offset="1" stop-color="#10232d"/></linearGradient>
  <linearGradient id="headline" x1="0" y1="0" x2="1" y2=".2"><stop stop-color="#fff5e8"/><stop offset=".48" stop-color="#ffd166"/><stop offset="1" stop-color="#ff8b9b"/></linearGradient>
  <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63e6d2"/><stop offset=".48" stop-color="#a99aff"/><stop offset="1" stop-color="#ff8b9b"/></linearGradient>
  <radialGradient id="pinkGlow"><stop stop-color="#ff7aa2" stop-opacity=".28"/><stop offset="1" stop-color="#ff7aa2" stop-opacity="0"/></radialGradient>
  <radialGradient id="aquaGlow"><stop stop-color="#63e6d2" stop-opacity=".22"/><stop offset="1" stop-color="#63e6d2" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e6e9ff" opacity=".16"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  <filter id="softGlow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1440" height="470" rx="28" fill="url(#bg)"/>
<rect width="1440" height="470" rx="28" fill="url(#dots)"/>
<circle cx="1110" cy="195" r="260" fill="url(#pinkGlow)" filter="url(#blur)"/>
<circle cx="1300" cy="390" r="190" fill="url(#aquaGlow)" filter="url(#blur)"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="76" y="66" fill="#63e6d2" font-size="15" font-weight="700" letter-spacing="4">AEL / INTELLIGENCE LAB</text>
  <circle cx="302" cy="60" r="4" fill="#ffd166"/><circle cx="316" cy="60" r="4" fill="#ff8b9b"/><circle cx="330" cy="60" r="4" fill="#a99aff"/>
  <text x="72" y="163" fill="url(#headline)" font-size="61" font-weight="800" letter-spacing="-2">Curiosity starts</text>
  <text x="72" y="230" fill="#f8f7ff" font-size="61" font-weight="800" letter-spacing="-2">the idea.</text>
  <text x="76" y="291" fill="#63e6d2" font-size="43" font-weight="800" letter-spacing="-1.4">Engineering makes it real.</text>
  <text x="79" y="330" fill="#b8bfd9" font-size="17">I build intelligent systems, explore hard problems, and turn ideas into useful products.</text>
  <g transform="translate(78 370)">
    <rect width="132" height="37" rx="18.5" fill="#203d43" stroke="#63e6d2" stroke-opacity=".65"/><text x="66" y="24" fill="#baf7ed" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">AI SYSTEMS</text>
    <rect x="144" width="120" height="37" rx="18.5" fill="#332d55" stroke="#a99aff" stroke-opacity=".7"/><text x="204" y="24" fill="#d8d0ff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">ML RESEARCH</text>
    <rect x="276" width="146" height="37" rx="18.5" fill="#563347" stroke="#ff8b9b" stroke-opacity=".7"/><text x="349" y="24" fill="#ffd0db" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PRODUCT BUILDING</text>
  </g>
</g>
<g transform="translate(1030 222)">
  <ellipse cx="0" cy="0" rx="260" ry="156" transform="rotate(-23)" fill="none" stroke="url(#orbit)" stroke-width="2" stroke-opacity=".5" stroke-dasharray="5 10"/>
  <ellipse cx="0" cy="0" rx="220" ry="116" transform="rotate(34)" fill="none" stroke="#ffd166" stroke-width="1.5" stroke-opacity=".32" stroke-dasharray="3 9"/>
  <ellipse cx="0" cy="0" rx="160" ry="86" transform="rotate(-6)" fill="none" stroke="#63e6d2" stroke-width="1.5" stroke-opacity=".38"/>
  <path d="M-210 -80 Q-105 -180 0 -4 T200 54" fill="none" stroke="#a99aff" stroke-opacity=".45" stroke-width="2"/>
  <path d="M-188 90 Q-65 20 28 -72 T196 -70" fill="none" stroke="#ff8b9b" stroke-opacity=".5" stroke-width="2"/>
  <circle cx="0" cy="0" r="78" fill="#202448" stroke="#ffd166" stroke-width="2.5" filter="url(#softGlow)"/>
  <circle cx="0" cy="0" r="63" fill="none" stroke="#63e6d2" stroke-opacity=".5" stroke-dasharray="4 7"/>
  <text x="0" y="-6" fill="#ffd166" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">IDEA</text>
  <path d="M-26 12 H22 M12 2 L24 12 L12 22" fill="none" stroke="#f8f7ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="0" y="43" fill="#baf7ed" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2">SYSTEM</text>
  <g filter="url(#softGlow)">
    <circle cx="-206" cy="-78" r="13" fill="#63e6d2"/><circle cx="178" cy="-96" r="11" fill="#ff8b9b"/>
    <circle cx="216" cy="87" r="14" fill="#ffd166"/><circle cx="-180" cy="110" r="10" fill="#a99aff"/>
    <circle cx="36" cy="-151" r="8" fill="#ff8b9b"/><circle cx="-45" cy="151" r="9" fill="#63e6d2"/>
    <circle cx="270" cy="-4" r="7" fill="#a99aff"/>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1">
    <rect x="-290" y="-112" width="76" height="27" rx="13.5" fill="#1e4146" stroke="#63e6d2"/><text x="-252" y="-94" fill="#c4fff5" text-anchor="middle">DATA</text>
    <rect x="174" y="-142" width="80" height="27" rx="13.5" fill="#503044" stroke="#ff8b9b"/><text x="214" y="-124" fill="#ffd6df" text-anchor="middle">VISION</text>
    <rect x="213" y="112" width="84" height="27" rx="13.5" fill="#51472c" stroke="#ffd166"/><text x="255" y="130" fill="#fff0bd" text-anchor="middle">AGENTS</text>
    <rect x="-258" y="135" width="100" height="27" rx="13.5" fill="#362f5c" stroke="#a99aff"/><text x="-208" y="153" fill="#e3dcff" text-anchor="middle">RESEARCH</text>
  </g>
</g>
<text x="1370" y="438" fill="#8190b7" text-anchor="end" font-family="monospace" font-size="11" letter-spacing="2">DAMITTA, EGYPT  /  BUILD • LEARN • REPEAT</text>
</svg>