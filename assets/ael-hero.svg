<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
<title id="title">Abdelrahman El-Harouny — فارس لا يهاب التجربة</title>
<desc id="desc">A calm editorial banner with a restrained architectural line motif and the Arabic phrase فارس لا يهاب التجربة as the main visual identity.</desc>
<defs>
