<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
<title id="title">Abdelrahman El-Harouny — Applied Intelligence and Engineering</title>
<desc id="desc">A restrained technical identity built around real-world problem solving, applied artificial intelligence, machine learning, and reliable software systems.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A0F12"/><stop offset=".58" stop-color="#10191D"/><stop offset="1" stop-color="#0B1215"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D7F36A"/><stop offset="1" stop-color="#A6DDA8"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#162329"/><stop offset="1" stop-color="#10191D"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8FA49A" stroke-opacity=".09" stroke-width="1"/></pattern>
  <radialGradient id="glow"><stop stop-color="#C9EE6A" stop-opacity=".16"/><stop offset="1" stop-color="#C9EE6A" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
