  <text x="80" y="319" fill="#D7F36A" font-size="28" font-weight="700" letter-spacing="-.6">Complex problems. Engineered intelligence.</text>
  <text x="82" y="359" fill="#B5C0BC" font-size="17">I build intelligent systems from real-world problems — from research and data</text>
  <text x="82" y="385" fill="#B5C0BC" font-size="17">to reliable software, measurable evaluation, and products people can use.</text>

  <text x="82" y="425" fill="#81918D" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.7">COMPUTER SCIENCE</text>
